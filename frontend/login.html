<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — DocAnalysis</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 44px 40px;
      width: 420px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-icon { font-size: 38px; display: block; margin-bottom: 8px; }
    .logo h1   { color: #fff; font-size: 22px; font-weight: 700; }
    .logo p    { color: rgba(255,255,255,0.5); font-size: 13px; margin-top: 4px; }

    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      color: rgba(255,255,255,0.7);
      font-size: 13px; font-weight: 500;
      margin-bottom: 7px;
    }
    input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      color: #fff; font-size: 14px; outline: none;
      transition: all 0.2s;
    }
    input::placeholder { color: rgba(255,255,255,0.3); }
    input:focus {
      border-color: #7c3aed;
      background: rgba(124,58,237,0.15);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.2);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      transition: all 0.2s; margin-top: 6px;
    }
    .btn:hover   { opacity: 0.9; transform: translateY(-1px); }
    .btn:active  { transform: translateY(0); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .footer-link {
      text-align: center; margin-top: 22px;
      color: rgba(255,255,255,0.5); font-size: 13px;
    }
    .footer-link a { color: #a78bfa; text-decoration: none; font-weight: 600; }
    .footer-link a:hover { color: #c4b5fd; }

    .alert {
      padding: 12px 16px; border-radius: 10px;
      font-size: 13px; margin-bottom: 18px; display: none;
    }
    .alert.error {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.4);
      color: #fca5a5; display: block;
    }
    .alert.success {
      background: rgba(16,185,129,0.15);
      border: 1px solid rgba(16,185,129,0.4);
      color: #6ee7b7; display: block;
    }

    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0; color: rgba(255,255,255,0.3); font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px; background: rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">
    <span class="logo-icon">🧠</span>
    <h1>DocAnalysis AI</h1>
    <p>Sign in to your account</p>
  </div>

  <div id="alert" class="alert"></div>

  <form id="loginForm">
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Your username" required autocomplete="username"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Your password" required autocomplete="current-password"/>
    </div>
    <button type="submit" class="btn" id="submitBtn">Sign In</button>
  </form>

  <div class="divider">or</div>

  <div class="footer-link">
    Don't have an account? <a href="register.html">Register</a>
  </div>
</div>

<script>
  const API = "http://127.0.0.1:8000";

  // If already logged in, go home
  if (localStorage.getItem("access_token")) {
    window.location.href = "home.html";
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn      = document.getElementById("submitBtn");
    const alertEl  = document.getElementById("alert");

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    btn.disabled   = true;
    btn.innerHTML  = '<span class="spinner"></span>Signing in...';
    alertEl.className = "alert";
    alertEl.style.display = "none";

    try {
      const res = await fetch(`${API}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (res.ok) {
        // Save tokens & username to localStorage
        localStorage.setItem("access_token",  data.access_token);
        localStorage.setItem("refresh_token", data.refresh_token);
        localStorage.setItem("username",       username);

        alertEl.className = "alert success";
        alertEl.textContent = `✅ Welcome back, ${username}! Redirecting...`;

        setTimeout(() => window.location.href = "home.html", 1000);
      } else {
        alertEl.className = "alert error";
        alertEl.textContent = `❌ ${data.detail || "Login failed"}`;
        btn.disabled  = false;
        btn.innerHTML = "Sign In";
      }
    } catch (err) {
      alertEl.className = "alert error";
      alertEl.textContent = "❌ Cannot connect to server. Is the API running?";
      btn.disabled  = false;
      btn.innerHTML = "Sign In";
    }
  });
</script>
</body>
</html>
